name: .NET — Build, Test & Publish

# Triggered on every push/PR to main (CI) and on `dotnet/v*` tags (publish).
# Tag format: dotnet/v1.2.3  →  NuGet version 1.2.3
on:
  push:
    branches: [main]
    tags:
      - 'dotnet/v*'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── 1. Build quickjs.wasm, then build + test the .NET library ────────────
  build-and-test:
    name: Build & Test (.NET ${{ matrix.dotnet }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        dotnet: ['10.x']

    steps:
      - name: Checkout (with submodules for quickjs-ng)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # pnpm is needed so that `pnpm install` makes binaryen's wasm-opt
      # available for the Makefile's post-link optimisation step.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies (provides wasm-opt via binaryen)
        run: pnpm install --frozen-lockfile

      - name: Install wasi-sdk
        run: make setup

      # Build only the core quickjs.wasm reactor — not the extensions.
      # The Makefile variable OUTPUT defaults to quickjs.wasm.
      - name: Build quickjs.wasm
        run: make quickjs.wasm

      # Place the binary where the EmbeddedResource picks it up at build time.
      - name: Stage WASM for embedding
        run: |
          mkdir -p src/dotnet/QuickJsWasi/Resources
          cp quickjs.wasm src/dotnet/QuickJsWasi/Resources/quickjs.wasm

      - name: Setup .NET ${{ matrix.dotnet }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Restore dependencies
        run: dotnet restore src/dotnet/QuickJsWasi.sln

      - name: Build solution
        run: dotnet build src/dotnet/QuickJsWasi.sln --no-restore -c Release

      - name: Run tests
        run: dotnet test src/dotnet/QuickJsWasi.sln --no-build -c Release --logger "console;verbosity=normal"

      # Upload the packed WASM + DLL as a workflow artifact so the publish job
      # can reuse them without rebuilding from scratch.
      - name: Determine version
        id: pkg_version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/dotnet/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/dotnet/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack NuGet package
        run: |
          VERSION_ARGS=()
          if [[ -n "${{ steps.pkg_version.outputs.version }}" ]]; then
            VERSION_ARGS=("-p:Version=${{ steps.pkg_version.outputs.version }}")
          fi
          dotnet pack src/dotnet/QuickJsWasi/QuickJsWasi.csproj \
            --no-build -c Release \
            -o nupkg \
            "${VERSION_ARGS[@]}"

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ matrix.dotnet }}
          path: nupkg/
          if-no-files-found: error

      - name: Upload QuickJs artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickjs-wasm-${{ steps.pkg_version.outputs.version }}
          path: src/dotnet/QuickJsWasi/Resources/quickjs.wasm
          if-no-files-found: error

  # ── 2. Publish to NuGet.org (tag-triggered only) ─────────────────────────
  publish:
    name: Publish to NuGet.org
    needs: build-and-test
    # Only run when a dotnet/v* tag is pushed — not on PRs or plain main pushes.
    if: startsWith(github.ref, 'refs/tags/dotnet/v')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # needed for attestation / provenance (optional but recommended)

    steps:
      # Extract the semver from the tag (dotnet/v1.2.3 → 1.2.3) so callers
      # can verify the pushed version matches what was packed in the CI job.
      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/dotnet/v}"
          echo "VERSION=$TAG" >> "$GITHUB_ENV"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download NuGet artifact
        uses: actions/download-artifact@v4
        with:
          name: nupkg-10.x
          path: nupkg/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # Push .nupkg and .snupkg (symbols) in one command.
      # Set NUGET_API_KEY in the repo's Settings → Secrets → Actions.
      - name: Push to NuGet.org
        run: |
          dotnet nuget push "nupkg/*.nupkg" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
